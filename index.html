<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点字リアルタイム翻訳(プロトタイプ)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #1a1d23; color: #e8e8e8;
    padding: 16px; max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  .sub { color: #999; font-size: 0.8rem; margin-bottom: 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab {
    padding: 8px 16px; border: 1px solid #444; border-radius: 8px;
    background: #2a2e36; color: #ccc; cursor: pointer; font-size: 0.95rem;
  }
  .tab.active { background: #3a6ea5; border-color: #3a6ea5; color: #fff; }
  .panel { margin-bottom: 12px; }
  textarea {
    width: 100%; height: 60px; border-radius: 8px; border: 1px solid #444;
    background: #2a2e36; color: #eee; padding: 8px; font-size: 1rem;
  }
  button.action {
    margin-top: 6px; padding: 8px 20px; border-radius: 8px; border: none;
    background: #3a6ea5; color: #fff; font-size: 0.95rem; cursor: pointer;
  }
  .controls { display: flex; gap: 16px; align-items: center; margin: 10px 0; font-size: 0.85rem; color: #bbb; flex-wrap: wrap; }
  .viewer { background: #000; border-radius: 10px; overflow: hidden; text-align: center; }
  canvas { max-width: 100%; display: block; margin: 0 auto; }
  video { max-width: 100%; }
  .result {
    margin-top: 12px; background: #262a31; border-radius: 10px; padding: 14px;
  }
  .result h2 { font-size: 0.85rem; color: #8ab; margin-bottom: 6px; }
  #output { font-size: 1.6rem; line-height: 1.5; white-space: pre-wrap; min-height: 1.5em; }
  #stats { margin-top: 8px; color: #777; font-size: 0.75rem; }
  input[type="file"] { color: #ccc; }
  select { background: #2a2e36; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 4px 8px; }
</style>
</head>
<body>
  <h1>点字リアルタイム翻訳 <span style="font-weight:normal;color:#8ab">プロトタイプ</span></h1>
  <p class="sub">カメラ・画像から日本語点字を検出して墨字(普通の文字)に翻訳します</p>

  <div class="tabs">
    <button class="tab" data-mode="demo">デモ</button>
    <button class="tab" data-mode="camera">カメラ</button>
    <button class="tab" data-mode="upload">画像</button>
  </div>

  <div id="demo-panel" class="panel">
    <textarea id="demo-text">てんじを ほんやく します
すうじ 123 えいご abc</textarea>
    <button id="demo-run" class="action">点字画像を生成して認識</button>
  </div>

  <div id="upload-panel" class="panel" style="display:none">
    <input type="file" id="file" accept="image/*">
  </div>

  <div class="controls">
    <label><input type="checkbox" id="autoSens" checked> 感度自動</label>
    <label>手動感度 <input type="range" id="thresh" min="4" max="40" value="18" disabled></label>
    <label>種類
      <select id="mode">
        <option value="auto">自動判別</option>
        <option value="emboss">実物の点字(浮き出し)</option>
        <option value="print">印刷(暗い点)</option>
        <option value="print-light">印刷(明るい点)</option>
      </select>
    </label>
  </div>

  <div class="viewer">
    <video id="video" playsinline muted style="display:none"></video>
    <canvas id="view"></canvas>
  </div>

  <div class="result">
    <h2>翻訳結果</h2>
    <div id="output"></div>
    <div id="stats"></div>
  </div>

  <!-- ?v= はデプロイごとに上げてブラウザキャッシュを無効化する -->
  <script src="braille.js?v=9"></script>
  <script src="vision.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
